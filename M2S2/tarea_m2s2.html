<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro para un Torneo de Videojuegos</title>
</head>
<body>

  <form action="resultado.html" method="GET">
    <table border="1" cellpadding="5">
      
      <!-- Nombre del jugador -->
      <tr>
        <td>Nombre del jugador:</td>
        <td>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" minlength="3" maxlength="15" required>
        </td>
      </tr>

      <!-- Correo electrónico -->
      <tr>
        <td>Correo:</td>
        <td>
          <input type="email" id="correo" name="correo" placeholder="Escribe tu correo" required>
        </td>
      </tr>

      <!-- Edad -->
      <tr>
        <td>Edad:</td>
        <td>
          <input type="number" id="edad" name="edad" placeholder="18" min="12" max="40" required>
        </td>
      </tr>

      <!-- Nickname -->
      <tr>
        <td>Nickname:</td>
        <td>
          <input type="text" id="nickname" name="nickname" placeholder="Escribe tu nickname" pattern="[A-Za-z0-9]+$" title="Solo letras y números">
        </td>
      </tr>

      <!-- Categoría -->
      <tr>
        <td>Categoría:</td>
        <td>
          <input type="radio" id="principiante" name="categoria" value="Principiante" required>
          <label for="principiante">Principiante</label>

           <input type="radio" id="intermedio" name="categoria" value="Intermedio">
          <label for="intermedio">Intermedio</label>

          <input type="radio" id="experto" name="categoria" value="Experto">
          <label for="experto">Experto</label>
        </td>
      </tr>

      <!-- Juegos favoritos -->
      <tr>
        <td>Juegos favoritos:</td>
        <td>
          <input type="checkbox" id="fifa" name="juegos" value="FIFA">
          <label for="fifa">FIFA</label>

          <input type="checkbox" id="lol" name="juegos" value="LoL">
          <label for="lol">LoL</label>

          <input type="checkbox" id="minecraft" name="juegos" value="Minecraft">
          <label for="minecraft">Minecraft</label>
        </td>
      </tr>

      <!-- Fecha de inscripción -->
      <tr>
        <td>Fecha inscripción:</td>
        <td>
          <input type="date" id="fecha" name="fecha" min="2026-01-01" max="2026-12-31">
        </td>
      </tr>

      <!-- Botones Enviar y Restablecer -->
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Enviar">
          <input type="reset" value="Restablecer">
        </td>
      </tr>

    </table>
  </form>

</body>
</html>
